name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting and lint
        run: bun run lint:check

      - name: Build frontend
        run: bun run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENVIRONMENT: staging
      SECRET_KEY: cccccccccccccccccccccccccccccccc
      FIRST_SUPERUSER: ci-admin@example.com
      FIRST_SUPERUSER_PASSWORD: aaaaaaaaaaaaaaaa
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pppppppppppppppp
      FRONTEND_HOST: http://localhost:5173
      METRICS_ENABLED: "false"

    services:
      postgres:
        image: pgvector/pgvector@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e # 0.8.5-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pppppppppppppppp
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          cache-dependency-glob: uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run database migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Check backend formatting and lint
        run: uv run ruff check app tests scripts
        working-directory: backend

      - name: Run mypy
        run: uv run mypy app
        working-directory: backend

      - name: Run ty
        run: uv run ty check app
        working-directory: backend

      - name: Run backend tests
        run: uv run pytest
        working-directory: backend
  e2e:
    name: Playwright E2E
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      ENVIRONMENT: local
      SECRET_KEY: cccccccccccccccccccccccccccccccc
      FIRST_SUPERUSER: ci-admin@example.com
      FIRST_SUPERUSER_PASSWORD: aaaaaaaaaaaaaaaa
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pppppppppppppppp
      FRONTEND_HOST: http://localhost:5173
      BACKEND_CORS_ORIGINS: http://localhost:5173
      REDIS_URL: redis://localhost:6379/0
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_SSL: "false"
      EMAILS_FROM_EMAIL: noreply@example.com
      METRICS_ENABLED: "false"
      VITE_API_URL: http://localhost:8000
      MAILCATCHER_HOST: http://localhost:1080

    services:
      postgres:
        image: pgvector/pgvector@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pppppppppppppppp
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis@sha256:223b183cbc49f5ff48728e1fc52ccf101f05072decad2bd9867281a3c9bf75fd # 8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailcatcher:
        image: schickling/mailcatcher@sha256:55ed289525a565f7587b138a423705267eb34eda1ec8d35acd6dc7966a933e84 # latest
        ports:
          - 1025:1025
          - 1080:1080

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
          cache-dependency-glob: uv.lock

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium and operating-system dependencies
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Initialize database
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run Playwright E2E
        run: |
          cd backend
          uv run fastapi run app/main.py \
            --host 0.0.0.0 \
            --port 8000 \
            > ../backend-e2e.log 2>&1 &
          backend_pid=$!
          cd ..

          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          backend_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://localhost:8000/api/v1/utils/health/ready \
              > /dev/null; then
              backend_ready=true
              break
            fi
            sleep 2
          done

          if [ "$backend_ready" != "true" ]; then
            cat backend-e2e.log
            exit 1
          fi

          mailcatcher_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://localhost:1080/messages \
              > /dev/null; then
              mailcatcher_ready=true
              break
            fi
            sleep 2
          done

          if [ "$mailcatcher_ready" != "true" ]; then
            cat backend-e2e.log
            exit 1
          fi

          cd frontend
          bunx playwright test --project=chromium

      - name: Upload Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
          if-no-files-found: warn
          retention-days: 14
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1


    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan reachable Git history
        env:
          REPO_PATH: ${{ github.workspace }}
        run: >-
          docker run --rm
          -v "${REPO_PATH}:/repo:ro"
          "${GITLEAKS_IMAGE}"
          git --redact --no-banner --verbose /repo

      - name: Scan project-owned files
        shell: bash
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          paths=(
            backend/app
            backend/tests
            backend/scripts
            backend/evals
            frontend/src
            frontend/tests
            frontend/public
            .github
            hooks
            scripts
          )

          for path in "${paths[@]}"; do
            if [ -e "${REPO_PATH}/${path}" ]; then
              docker run --rm \
                -v "${REPO_PATH}:/repo:ro" \
                "${GITLEAKS_IMAGE}" \
                dir --redact --no-banner "/repo/${path}"
            fi
          done
