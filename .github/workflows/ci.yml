name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend formatting and lint
        run: bun run lint:check

      - name: Build frontend
        run: bun run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENVIRONMENT: staging
      SECRET_KEY: cccccccccccccccccccccccccccccccc
      FIRST_SUPERUSER: ci-admin@example.com
      FIRST_SUPERUSER_PASSWORD: aaaaaaaaaaaaaaaa
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pppppppppppppppp
      FRONTEND_HOST: http://localhost:5173
      METRICS_ENABLED: "false"

    services:
      postgres:
        image: pgvector/pgvector@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e # 0.8.5-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pppppppppppppppp
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.18"
          cache-dependency-glob: uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run database migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Check backend formatting and lint
        run: uv run ruff check app tests scripts
        working-directory: backend

      - name: Run mypy
        run: uv run mypy app
        working-directory: backend

      - name: Run ty
        run: uv run ty check app
        working-directory: backend

      - name: Run backend tests
        run: uv run pytest
        working-directory: backend

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1


    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan reachable Git history
        env:
          REPO_PATH: ${{ github.workspace }}
        run: >-
          docker run --rm
          -v "${REPO_PATH}:/repo:ro"
          "${GITLEAKS_IMAGE}"
          git --redact --no-banner --verbose /repo

      - name: Scan project-owned files
        shell: bash
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          paths=(
            backend/app
            backend/tests
            backend/scripts
            backend/evals
            frontend/src
            frontend/tests
            frontend/public
            .github
            hooks
            scripts
          )

          for path in "${paths[@]}"; do
            if [ -e "${REPO_PATH}/${path}" ]; then
              docker run --rm \
                -v "${REPO_PATH}:/repo:ro" \
                "${GITLEAKS_IMAGE}" \
                dir --redact --no-banner "/repo/${path}"
            fi
          done
